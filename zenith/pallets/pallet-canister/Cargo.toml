[package]
name = "pallet-canister"
version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
license = { workspace = true }

[dependencies]
codec = { workspace = true }
scale-info = { version = "2.10", features = ["derive"] }
serde = { workspace = true }

frame-benchmarking = { version = "27.0", default-features = false, optional = true }
frame-support = { version = "27.0", default-features = false }
frame-system = { version = "27.0", default-features = false }
sp-core = { version = "28.0", default-features = false }
sp-runtime = { version = "31.0", default-features = false }
sp-std = { version = "14.0", default-features = false }

[features]
default = ["std"]
std = [
    "codec/std",
    "frame-benchmarking/std",
    "frame-support/std",
    "frame-system/std",
    "scale-info/std",
    "serde/std",
    "sp-core/std",
    "sp-runtime/std",
    "sp-std/std",
]
runtime-benchmarks = ["frame-benchmarking/runtime-benchmarks"]
try-runtime = ["frame-support/try-runtime"]
