name: ZK Benchmarks

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang curl libssl-dev llvm libudev-dev protobuf-compiler

      - name: Cache cargo
        uses: actions/cache@v3
        with:
          path: target
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}

      - name: Benchmark Plonk
        run: cargo bench -p zk-plonk --no-run 2>&1 | tee plonk-bench.txt
        continue-on-error: true

      - name: Benchmark Cairo
        run: cargo bench -p zk-cairo --no-run 2>&1 | tee cairo-bench.txt
        continue-on-error: true

      - name: Benchmark RISC Zero
        run: cargo bench -p zk-risc-zero --no-run 2>&1 | tee risc-zero-bench.txt
        continue-on-error: true

      - name: Upload benchmark results
        uses: actions/upload-artifact@v3
        with:
          name: zk-benchmarks
          path: |
            plonk-bench.txt
            cairo-bench.txt
            risc-zero-bench.txt
