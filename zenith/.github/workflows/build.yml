name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang curl libssl-dev llvm libudev-dev protobuf-compiler

      - name: Build node (release)
        run: cargo build --release -p zenith-node

      - name: Build runtime Wasm
        run: cargo build --release --target wasm32-unknown-unknown -p zenith-runtime

      - name: Upload node artifact
        uses: actions/upload-artifact@v3
        with:
          name: zenith-node
          path: target/release/zenith-node

      - name: Upload runtime artifact
        uses: actions/upload-artifact@v3
        with:
          name: zenith-runtime
          path: target/wasm32-unknown-unknown/release/zenith_runtime.wasm

  build-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang curl libssl-dev llvm libudev-dev protobuf-compiler

      - name: Build CLI (release)
        run: cargo build --release -p zenith-cli

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v3
        with:
          name: zenith-cli
          path: target/release/zenith

  build-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang curl libssl-dev llvm libudev-dev protobuf-compiler

      - name: Build gateway (release)
        run: cargo build --release -p zenith-gateway

      - name: Upload gateway artifact
        uses: actions/upload-artifact@v3
        with:
          name: zenith-gateway
          path: target/release/gateway

  docker-build:
    needs: [build-node, build-gateway]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Download node artifact
        uses: actions/download-artifact@v3
        with:
          name: zenith-node
          path: docker/

      - name: Download gateway artifact
        uses: actions/download-artifact@v3
        with:
          name: zenith-gateway
          path: docker/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker images
        run: echo "Docker build would go here"
