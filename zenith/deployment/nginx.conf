# Zenith Platform - nginx Reverse Proxy Configuration with TLS/HTTPS
# Usage:
#   1. Install nginx: apt-get install nginx
#   2. Copy this file to /etc/nginx/sites-available/zenith
#   3. Create symlink: ln -s /etc/nginx/sites-available/zenith /etc/nginx/sites-enabled/
#   4. Setup SSL with Let's Encrypt:
#      certbot certonly --nginx -d api.zenith.io
#   5. Test config: nginx -t
#   6. Restart: systemctl restart nginx

upstream zenith_gateway {
    server 127.0.0.1:8000;
    keepalive 32;
}

# Rate limiting - per IP
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;

# HTTP to HTTPS redirect
server {
    listen 80;
    server_name api.zenith.io *.zenith.io;

    # Let's Encrypt validation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.zenith.io;

    # SSL Certificate paths (generated by Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/api.zenith.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.zenith.io/privkey.pem;

    # SSL Configuration (modern, A+ rating at ssllabs.com)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/api.zenith.io/chain.pem;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), microphone=(), geolocation=()" always;

    # Logging
    access_log /var/log/nginx/zenith_access.log combined buffer=32k flush=5s;
    error_log /var/log/nginx/zenith_error.log warn;

    # Rate limiting
    limit_req zone=api_limit burst=200 nodelay;

    # Main proxy
    location / {
        proxy_pass http://zenith_gateway;
        proxy_http_version 1.1;

        # Connection management
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;

        # Disable buffering for real-time endpoints
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Health check endpoint (no auth needed, no rate limit)
    location = /health {
        proxy_pass http://zenith_gateway;
        access_log off;
        limit_req off;
    }

    # Metrics endpoint (restricted to internal IPs)
    location = /v1/metrics {
        proxy_pass http://zenith_gateway;

        # Restrict to monitoring IPs only
        allow 127.0.0.1;
        allow 10.0.0.0/8;  # Internal network
        deny all;
    }

    # WebSocket support (if needed for future features)
    location ~ /ws {
        proxy_pass http://zenith_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}

# Wildcard subdomain for canister-specific endpoints (optional)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ~^(?<canister>[a-z0-9-]+)\.zenith\.io$;

    ssl_certificate /etc/letsencrypt/live/api.zenith.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.zenith.io/privkey.pem;

    # Same security headers as main server
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location / {
        proxy_pass http://zenith_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
