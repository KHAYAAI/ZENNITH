# Zenith Nginx TLS Reverse Proxy
# Proxies HTTPS traffic to backend gateway nodes
# Handles load balancing, caching, compression

user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
}

http {
    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # MIME types
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log combined;
    error_log /var/log/nginx/error.log warn;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=wss_limit:10m rate=100r/s;

    # Upstream gateway nodes
    upstream zenith_gateways {
        least_conn;  # Use least connections load balancing

        server gateway-1:8000 weight=1 max_fails=3 fail_timeout=30s;
        server gateway-2:8000 weight=1 max_fails=3 fail_timeout=30s;
        server gateway-3:8000 weight=1 max_fails=3 fail_timeout=30s;

        # Health check
        check interval=3000 rise=2 fall=5 timeout=1000 type=http;
        check_http_send "GET /health HTTP/1.0\r\n\r\n";
        check_http_expect_alive http_2xx http_3xx;
    }

    # HTTP to HTTPS redirect
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # ACME challenge for Let's Encrypt
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all other traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS main server
    server {
        listen 443 ssl http2 default_server;
        listen [::]:443 ssl http2 default_server;
        server_name zenith.network www.zenith.network;

        # SSL/TLS configuration
        ssl_certificate /etc/letsencrypt/live/zenith.network/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/zenith.network/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/zenith.network/chain.pem;

        # SSL/TLS optimization
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_stapling on;
        ssl_stapling_verify on;

        # Security
        add_header Content-Security-Policy "default-src 'self'" always;
        add_header X-Robots-Tag "noindex, nofollow" always;

        # Logging
        access_log /var/log/nginx/zenith-access.log combined;
        error_log /var/log/nginx/zenith-error.log warn;

        # Root location - health check
        location = / {
            access_log off;
            return 200 "Zenith Gateway\n";
            add_header Content-Type text/plain;
        }

        # Health check endpoint
        location = /health {
            access_log off;
            proxy_pass http://zenith_gateways;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }

        # REST API v1 endpoints
        location /v1/ {
            # Rate limiting
            limit_req zone=api_limit burst=20 nodelay;

            # Proxy settings
            proxy_pass http://zenith_gateways;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $server_name;

            # Timeouts
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            # Buffering
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 4 4k;
            proxy_busy_buffers_size 8k;

            # Cache for GET requests (5 minutes)
            proxy_cache_methods GET HEAD;
            proxy_cache_valid 200 5m;
            proxy_cache_use_stale error timeout invalid_header updating;
            add_header X-Cache-Status $upstream_cache_status;
        }

        # WebSocket endpoint for subscriptions
        location /ws {
            # Higher rate limit for WebSockets
            limit_req zone=wss_limit burst=100 nodelay;

            # Proxy settings
            proxy_pass http://zenith_gateways;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket specific timeouts
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Metrics endpoint (internal only)
        location /metrics {
            allow 10.0.0.0/8;      # Private network
            allow 172.16.0.0/12;   # Private network
            deny all;

            proxy_pass http://zenith_gateways;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Block suspicious requests
        location ~ \.php$ {
            deny all;
        }

        location ~ /\. {
            deny all;
        }

        location ~ ~$ {
            deny all;
        }

        # Monitoring endpoint
        location /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            deny all;
        }
    }

    # Status and monitoring endpoints
    server {
        listen 8080;
        listen [::]:8080;
        server_name _;

        location /nginx_status {
            stub_status on;
            access_log off;
        }

        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
    }

    # Includes
    include /etc/nginx/conf.d/*.conf;
}
